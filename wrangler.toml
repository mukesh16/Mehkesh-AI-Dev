name = "ai-mehkesh-dev"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Static Assets (Brand Logo & Assets)
[assets]
directory = "./public"

# Cloudflare Workers AI Binding (10,000 Free Neurons/day)
[ai]
binding = "AI"

# Cloudflare D1 Database Binding for Dev
[[d1_databases]]
binding = "DB"
database_name = "mehkesh-ai-dev"
database_id = "REPLACE_WITH_MEHKESH_AI_DEV_DATABASE_ID"

# Daily Briefing Cron Trigger: 01:30 UTC = 7:00 AM IST (Indian Standard Time)
[triggers]
crons = ["30 1 * * *"]

# Custom Domain Route for Dev
[[routes]]
pattern = "AI-Dev.mehkesh.com"
custom_domain = true

[vars]
APP_NAME = "Mehkesh AI (Dev)"
DEFAULT_USER_BUDGET = "2000"
ADMIN_EMAIL = "ai@mehkesh.com"
# Optional Google OAuth Client ID (paste your Google Client ID here or set via secret)
GOOGLE_CLIENT_ID = ""
